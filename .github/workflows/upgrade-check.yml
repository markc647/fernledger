name: Check for a Fernledger update

# For copies made with the Deploy button. Once a week it looks for a newer Fernledger release and, if there is one,
# opens a pull request that brings this copy up to it. Merge it and Cloudflare deploys.
# It does nothing in the upstream repository. The decisions are in scripts/upgrade-check.mjs (tested by
# scripts/upgrade-check.test.mjs, which also checks the rules in this file); README.md#updating explains the rest.
#
# One setting is needed in your copy: Settings > Actions > General > Workflow permissions >
# "Allow GitHub Actions to create and approve pull requests".

on:
  schedule:
    - cron: "41 3 * * 2" # Tuesday 03:41 UTC; not on the hour, when scheduled runs are most delayed
  workflow_dispatch:

permissions: {}

jobs:
  upgrade:
    if: github.repository != 'markc647/fernledger'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    env:
      UPSTREAM: markc647/fernledger
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Look for a newer release
        id: plan
        run: |
          if gh api "repos/$UPSTREAM/releases/latest" > "$RUNNER_TEMP/release.json" 2> "$RUNNER_TEMP/error.txt"; then
            node scripts/upgrade-check.mjs plan "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/pr-body.md"
          elif grep -q "HTTP 404" "$RUNNER_TEMP/error.txt"; then
            echo "No release has been published yet."
            echo "upgrade=false" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/error.txt"
            exit 1
          fi

      - name: Open a pull request
        if: steps.plan.outputs.upgrade == 'true'
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          BRANCH: ${{ steps.plan.outputs.branch }}
          TITLE: ${{ steps.plan.outputs.title }}
          BASE: ${{ github.ref_name }}
        run: |
          if [ "$(gh pr list --state all --head "$BRANCH" --json number --jq length)" != "0" ]; then
            echo "A pull request for $TAG already exists (open, merged or closed). Nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          node scripts/upgrade-check.mjs apply "https://github.com/$UPSTREAM.git" "$TAG" "$RUNNER_TEMP/pr-body.md"
          git commit -m "Update Fernledger to ${TAG#v}"
          git push origin "$BRANCH"
          if ! gh pr create --base "$BASE" --head "$BRANCH" --title "$TITLE" --body-file "$RUNNER_TEMP/pr-body.md"; then
            echo "::error::Could not open the pull request. Turn on Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests, then run this workflow again."
            exit 1
          fi
