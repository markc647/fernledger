name: CI

on:
  # Push the branch; CI runs the full suite on it. A push uses the workflow file in the pushed commit, so this works from a branch that main has not caught up with.
  push:
    branches: [main, 'ui/**', 'fix/**', 'chore/**', 'ticket/**', 'update/**']
  pull_request:
  # Runs it by hand, once this file is on main. A test that fails only on CI can be run there many times:
  # `gh workflow run ci.yml --ref <branch> -f spec=rules-reorder -f grep="keyboard" -f repeat=20`.
  workflow_dispatch:
    inputs:
      spec:
        description: Only the spec files whose path matches this (e.g. rules-reorder)
        required: false
      grep:
        description: Only the tests whose title matches this
        required: false
      repeat:
        description: Run each test this many times
        required: false
        default: '1'

# One run for a branch: a push to a branch that has a pull request starts both a push run and a pull request run, and the newer replaces the older.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  # Browser tests (Playwright + axe) are slower than `check`, so they run as their own job. All run in light; the ones tagged @theme run in dark too (playwright.config.ts).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The inputs reach the shell as variables, never pasted into the script.
      - run: npm run test:e2e -- $SPEC ${GREP:+--grep "$GREP"} --repeat-each="$REPEAT"
        env:
          SPEC: ${{ inputs.spec }}
          GREP: ${{ inputs.grep }}
          REPEAT: ${{ inputs.repeat || '1' }}
      # The traces of the tests that failed (playwright.config.ts), for `npx playwright show-trace`.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7

  # gitleaks runs twice on purpose: `check` scans the working tree, this job scans git history.
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.24.3 # keep equal to VERSION in scripts/gitleaks.mjs
