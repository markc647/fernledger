# Default gitleaks rules plus guards against committing real bank data.
[extend]
useDefault = true

[[rules]]
id = "nz-bank-account-number"
description = "NZ bank account number (bank-branch-account-suffix)"
regex = '''\d{2}[- ]\d{4}[- ]\d{7}[- ]\d{2,3}'''

[[rules]]
id = "asb-csv-export-header"
description = "ASB CSV export header line"
regex = '''Bank \d{2}; Branch \d{4}; Account'''

[[rules]]
id = "asb-account-short-form"
description = "ASB account number in short 'Account NNNNNNN-NN' form"
regex = '''Account \d{7}-\d{2,3}'''

# Made-up fixtures (fake bank code 99) legitimately contain these shapes. This path only.
[allowlist]
description = "Made-up bank fixtures"
paths = ['''^test/fixtures/''']
